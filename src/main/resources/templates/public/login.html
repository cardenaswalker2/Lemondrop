<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso Administrativo - Lemon Drop</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        /* Modern Premium Styling */
        body {
            background-color: #FFFDF6;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        .split-layout {
            display: flex;
            min-height: 100vh;
        }
        
        /* Animated gradient on branding side */
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .branding-side {
            flex: 1.2;
            background: linear-gradient(135deg, #FCE22A 0%, #FFF494 30%, #A4D0A4 70%, #d8edd8 100%);
            background-size: 400% 400%;
            animation: gradientMove 15s ease infinite;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 80px;
            color: var(--dark);
            position: relative;
            box-shadow: inset -10px 0 20px rgba(0, 0, 0, 0.02);
        }
        
        .form-side {
            flex: 1;
            background: radial-gradient(circle at top right, rgba(164, 208, 164, 0.08) 0%, transparent 70%);
            background-color: #FFFDF6;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 80px;
            position: relative;
        }
        
        /* Glassmorphism card */
        .login-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px) saturate(120%);
            -webkit-backdrop-filter: blur(16px) saturate(120%);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 20px;
            padding: 45px 40px;
            box-shadow: 0 10px 30px rgba(164, 208, 164, 0.15), 0 1px 3px rgba(0, 0, 0, 0.02);
            max-width: 440px;
            width: 100%;
            margin: 0 auto;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .login-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(164, 208, 164, 0.22);
        }
        
        .brand-logo-badge {
            font-size: 4.5rem;
            animation: floatLogo 4s ease-in-out infinite;
            display: inline-block;
            margin-bottom: 25px;
        }
        
        @keyframes floatLogo {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(3deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        
        /* Inputs styling */
        .form-control {
            border: 2px solid rgba(164, 208, 164, 0.25);
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 0.95rem;
            transition: all 0.25s ease;
            background-color: rgba(255, 255, 255, 0.8);
        }
        
        .form-control:focus {
            border-color: var(--green-medium);
            box-shadow: 0 0 0 4px rgba(164, 208, 164, 0.18);
            background-color: #fff;
            outline: none;
        }
        
        .form-label {
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .btn-custom.btn-lemon {
            background-color: var(--lemon);
            color: #333;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(252, 226, 42, 0.3);
            transition: all 0.25s ease;
        }

        .btn-custom.btn-lemon:hover {
            background-color: var(--lemon-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(252, 226, 42, 0.45);
        }
        
        /* Responsive design */
        @media (max-width: 992px) {
            .split-layout {
                flex-direction: column;
            }
            .branding-side {
                padding: 50px 30px;
                flex: none;
                text-align: center;
                align-items: center;
            }
            .brand-logo-badge {
                font-size: 3.5rem;
                margin-bottom: 15px;
            }
            .form-side {
                padding: 40px 20px;
                flex: 1;
            }
            .login-card {
                padding: 35px 25px;
            }
        }
    </style>
</head>
<body>

    <div class="split-layout">
        <!-- Left: Branding -->
        <div class="branding-side">
            <div class="brand-logo-badge">🍋</div>
            <h1 style="font-size: 3.5rem; font-weight: 800; line-height: 1; font-family: 'Outfit'; margin: 0;">LEMON DROP</h1>
            <h3 style="font-family: 'Outfit'; margin-top: 15px; font-weight: 600; opacity: 0.9; font-size: 1.3rem;">Plataforma de Operación y Control</h3>
            <p style="margin-top: 20px; font-size: 1.05rem; opacity: 0.85; max-width: 500px; line-height: 1.6;">
                Panel de administración y gestión operativa de granizados para la feria escolar.
            </p>
        </div>

        <!-- Right: Login Form -->
        <div class="form-side">
            <div class="login-card">
                <h2 style="margin: 0 0 5px 0; font-size: 1.8rem; font-family: 'Outfit'; font-weight: 700;">Ingreso de Personal 🚪</h2>
                <p style="color: var(--text-secondary); margin-bottom: 25px; font-size: 0.9rem;">Ingresa tus credenciales autorizadas para acceder.</p>

                <!-- Error Warning -->
                <div th:if="${param.error}" style="background-color: rgba(255, 107, 107, 0.12); border-left: 4px solid var(--strawberry); color: #c92a2a; padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; font-size: 0.88rem; font-weight: 600; display: flex; align-items: center; gap: 8px;">
                    <span>❌ Usuario o contraseña incorrectos.</span>
                </div>

                <form th:action="@{/login}" method="post" style="display: flex; flex-direction: column; gap: 20px;">
                    <!-- CSRF input gets automatically populated by Thymeleaf th:action -->
                    <div class="form-group" style="display: flex; flex-direction: column;">
                        <label class="form-label">Usuario</label>
                        <input type="text" name="username" class="form-control" placeholder="Ej: asesor" required autofocus>
                    </div>

                    <div class="form-group" style="display: flex; flex-direction: column;">
                        <label class="form-label">Contraseña</label>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn-custom btn-lemon" style="width: 100%; font-size: 1.05rem; padding: 14px; margin-top: 10px;">Ingresar al Panel 🍧</button>
                </form>
                
                <div style="text-align: center; margin-top: 25px; border-top: 1px solid rgba(164, 208, 164, 0.15); padding-top: 20px;">
                    <a href="/" style="font-size: 0.9rem; font-weight: 600; color: var(--green-dark); text-decoration: none; transition: var(--transition-smooth);" onmouseover="this.style.opacity='0.8'" onmouseout="this.style.opacity='1'">
                        ← Volver a la Web Pública
                    </a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
