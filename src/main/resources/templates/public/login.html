<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Ingreso al Sistema - Lemon Drop 🍋</title>
    <link rel="stylesheet" th:href="@{/css/public-theme.css}">
    <style>
        .ld-login-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            min-height: 100dvh;
            width: 100%;
        }

        .ld-login-brand {
            background: linear-gradient(135deg, #173B24 0%, #0F2818 100%);
            color: var(--ld-white);
            padding: 60px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .ld-login-form-side {
            background: var(--ld-cream);
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .ld-login-card {
            background: var(--ld-white);
            border-radius: var(--radius-xl);
            padding: 36px 28px;
            box-shadow: var(--ld-shadow-lg);
            border: 1px solid rgba(47, 125, 50, 0.12);
            width: 100%;
            max-width: 420px;
        }

        @media (max-width: 900px) {
            .ld-login-layout {
                grid-template-columns: 1fr;
            }
            .ld-login-brand {
                padding: 36px 20px;
                text-align: center;
                align-items: center;
            }
            .ld-login-form-side {
                padding: 24px 16px;
            }
            .ld-login-card {
                padding: 28px 20px;
            }
        }
    </style>
</head>
<body style="background: var(--ld-cream); margin: 0; padding: 0; min-height: 100dvh;">

    <div class="ld-login-layout">
        <!-- Brand Side -->
        <div class="ld-login-brand">
            <div style="width: 48px; height: 48px; background: var(--ld-lemon); border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; margin-bottom: 18px; box-shadow: var(--ld-shadow-lemon);">
                🍋
            </div>
            <h1 style="font-size: clamp(2rem, 4vw, 2.6rem); color: var(--ld-white); margin-bottom: 8px; font-family: var(--font-heading);">LEMON DROP</h1>
            <h3 style="color: var(--ld-lemon); font-size: 1.05rem; font-weight: 600; margin-bottom: 12px;">Portal de Gestión</h3>
            <p style="color: var(--ld-green-mint); max-width: 440px; font-size: 0.92rem; line-height: 1.5;">
                Acceso exclusivo para administradores y asesores del stand de la Feria Escolar 2026.
            </p>
        </div>

        <!-- Form Side -->
        <div class="ld-login-form-side">
            <div class="ld-login-card">
                <span class="ld-badge ld-badge-lemon" style="font-size: 0.7rem; margin-bottom: 8px;">Portal Seguro</span>
                <h2 style="font-size: 1.5rem; margin-bottom: 4px; color: var(--ld-green-deepest);">Ingreso al Sistema 🚪</h2>
                <p style="font-size: 0.85rem; color: var(--ld-text-muted); margin-bottom: 20px;">Ingresa tus credenciales autorizadas.</p>

                <!-- Error Warning if invalid credentials -->
                <div th:if="${param.error}" style="background: var(--ld-strawberry-light); border-left: 4px solid var(--ld-strawberry); padding: 10px 14px; border-radius: var(--radius-md); color: #B91C1C; font-size: 0.85rem; font-weight: 600; margin-bottom: 16px;">
                    ❌ Usuario o contraseña incorrectos.
                </div>

                <form th:action="@{/login}" method="post" style="display: flex; flex-direction: column; gap: 14px;">
                    <div class="ld-form-group" style="margin-bottom: 0;">
                        <label class="ld-form-label">Usuario</label>
                        <input type="text" name="username" class="ld-input" placeholder="Ej: asesor" required autofocus>
                    </div>

                    <div class="ld-form-group" style="margin-bottom: 0;">
                        <label class="ld-form-label">Contraseña</label>
                        <input type="password" name="password" class="ld-input" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="ld-btn ld-btn-lemon" style="width: 100%; font-size: 1rem; padding: 12px; margin-top: 4px;">
                        Ingresar al Panel 🍧
                    </button>
                </form>

                <div style="text-align: center; margin-top: 24px; padding-top: 16px; border-top: 1px solid rgba(47, 125, 50, 0.12);">
                    <a href="/" style="font-weight: 700; font-size: 0.88rem; color: var(--ld-green-primary);">
                        ← Volver a la Tienda
                    </a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
