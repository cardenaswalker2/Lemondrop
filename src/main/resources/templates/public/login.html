<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso al Sistema - Lemon Drop 🍋</title>
    <link rel="stylesheet" th:href="@{/css/public-theme.css}">
    <style>
        .ld-login-layout {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            min-height: 100vh;
        }

        .ld-login-brand {
            background: linear-gradient(135deg, #173B24 0%, #0F2818 100%);
            color: var(--ld-white);
            padding: 80px 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .ld-login-brand::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255, 217, 26, 0.25) 0%, transparent 70%);
            top: 10%;
            left: -100px;
            filter: blur(50px);
        }

        .ld-login-form-side {
            background: var(--ld-cream);
            padding: 80px 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .ld-login-card {
            background: var(--ld-white);
            border-radius: var(--radius-xl);
            padding: 44px 36px;
            box-shadow: var(--ld-shadow-lg);
            border: 1px solid rgba(47, 125, 50, 0.12);
            width: 100%;
            max-width: 440px;
        }

        @media (max-width: 900px) {
            .ld-login-layout {
                grid-template-columns: 1fr;
            }
            .ld-login-brand {
                padding: 50px 24px;
                text-align: center;
                align-items: center;
            }
            .ld-login-form-side {
                padding: 40px 20px;
            }
            .ld-login-card {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body style="background: var(--ld-cream); margin: 0; padding: 0;">

    <div class="ld-login-layout">
        <!-- Brand Side -->
        <div class="ld-login-brand">
            <div style="width: 54px; height: 54px; background: var(--ld-lemon); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 2rem; margin-bottom: 24px; box-shadow: var(--ld-shadow-lemon);">
                🍋
            </div>
            <h1 style="font-size: 3rem; color: var(--ld-white); margin-bottom: 12px; font-family: var(--font-heading);">LEMON DROP</h1>
            <h3 style="color: var(--ld-lemon); font-size: 1.2rem; font-weight: 600; margin-bottom: 16px;">Plataforma de Gestión & Control</h3>
            <p style="color: var(--ld-green-mint); max-width: 480px; font-size: 1rem; line-height: 1.6;">
                Acceso exclusivo para administradores y asesores del stand de granizados en la Feria Escolar 2026.
            </p>
        </div>

        <!-- Form Side -->
        <div class="ld-login-form-side">
            <div class="ld-login-card">
                <span class="ld-badge ld-badge-lemon" style="font-size: 0.72rem; margin-bottom: 8px;">Portal Seguro</span>
                <h2 style="font-size: 1.8rem; margin-bottom: 6px; color: var(--ld-green-deepest);">Ingreso al Sistema 🚪</h2>
                <p style="font-size: 0.88rem; color: var(--ld-text-muted); margin-bottom: 24px;">Ingresa tus credenciales autorizadas.</p>

                <!-- Error Warning if invalid credentials -->
                <div th:if="${param.error}" style="background: var(--ld-strawberry-light); border-left: 4px solid var(--ld-strawberry); padding: 12px 16px; border-radius: var(--radius-md); color: #B91C1C; font-size: 0.88rem; font-weight: 600; margin-bottom: 20px;">
                    ❌ Usuario o contraseña incorrectos.
                </div>

                <form th:action="@{/login}" method="post" style="display: flex; flex-direction: column; gap: 18px;">
                    <div class="ld-form-group" style="margin-bottom: 0;">
                        <label class="ld-form-label">Usuario</label>
                        <input type="text" name="username" class="ld-input" placeholder="Ej: asesor" required autofocus>
                    </div>

                    <div class="ld-form-group" style="margin-bottom: 0;">
                        <label class="ld-form-label">Contraseña</label>
                        <input type="password" name="password" class="ld-input" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="ld-btn ld-btn-lemon" style="width: 100%; font-size: 1.05rem; padding: 14px; margin-top: 8px;">
                        Ingresar al Panel 🍧
                    </button>
                </form>

                <div style="text-align: center; margin-top: 28px; padding-top: 20px; border-top: 1px solid rgba(47, 125, 50, 0.12);">
                    <a href="/" style="font-weight: 700; font-size: 0.9rem; color: var(--ld-green-primary); transition: var(--transition-fast);">
                        ← Volver a la Tienda Pública
                    </a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
