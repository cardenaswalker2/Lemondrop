<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Pedido Confirmado! - Lemon Drop 🍋🎉</title>
    <link rel="stylesheet" th:href="@{/css/public-theme.css}">
    <style>
        .ld-success-card {
            background: var(--ld-white);
            border-radius: var(--radius-xl);
            box-shadow: var(--ld-shadow-xl);
            border: 1px solid rgba(47, 125, 50, 0.15);
            max-width: 620px;
            margin: 50px auto 70px auto;
            padding: 44px 36px;
            text-align: center;
        }

        .ld-code-pill {
            background: var(--ld-lemon-light);
            border: 2px dashed var(--ld-lemon-deep);
            padding: 16px 28px;
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 2px;
            border-radius: var(--radius-md);
            color: var(--ld-green-deepest);
            font-family: var(--font-heading);
            margin: 20px 0;
            display: inline-block;
            cursor: pointer;
            transition: var(--transition-fast);
        }

        .ld-code-pill:hover {
            transform: scale(1.03);
            background: #FFF5B8;
        }

        @media (max-width: 640px) {
            .ld-success-card {
                margin: 24px 16px;
                padding: 28px 18px;
            }
            .ld-code-pill {
                font-size: 1.6rem;
                padding: 12px 18px;
            }
        }
    </style>
</head>
<body class="ld-public-body">

    <!-- Public Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="ld-success-card">
        <span style="font-size: 3.5rem; display: block; margin-bottom: 8px;">🍧💛</span>
        <span class="ld-badge ld-badge-green" style="font-size: 0.78rem;">¡Pedido Registrado con Éxito!</span>
        
        <h1 style="font-size: 2.2rem; margin-top: 14px; color: var(--ld-green-deepest);">
            ¡TU GRANIZADO YA ESTÁ EN CAMINO!
        </h1>
        <p style="color: var(--ld-text-muted); margin-top: 10px; font-size: 0.95rem;">
            Tu orden ha sido recibida por nuestro equipo en el stand de la feria escolar.
        </p>

        <!-- Order Code Box -->
        <div>
            <span class="ld-code-pill" id="orderCodePill" onclick="copyOrderCode()" th:text="${order.orderCode}" title="Clic para copiar">
                LD-2026-00001
            </span>
            <div style="font-size: 0.8rem; color: var(--ld-text-muted); margin-top: -10px; margin-bottom: 20px;">
                👆 Toca el código para copiarlo
            </div>
        </div>

        <!-- Summary Details -->
        <div style="background: var(--ld-cream); border-radius: var(--radius-md); padding: 20px; text-align: left; margin-bottom: 28px; border: 1px solid rgba(47, 125, 50, 0.1);">
            <h4 style="font-size: 1rem; border-bottom: 1px solid rgba(47, 125, 50, 0.12); padding-bottom: 8px; margin-bottom: 12px;">Resumen de tu Orden</h4>
            <div th:each="item : ${order.items}" style="display: flex; justify-content: space-between; font-size: 0.92rem; margin-bottom: 8px;">
                <span th:text="${item.productName + ' (' + item.flavorName + ') x' + item.quantity}">Granizado x1</span>
                <span style="font-weight: 700;" th:text="${'$' + #numbers.formatDecimal(item.subtotal, 0, 'POINT', 0, 'COMMA')}">$8.000</span>
            </div>
            <div style="border-top: 1px solid rgba(47, 125, 50, 0.12); padding-top: 10px; margin-top: 10px; display: flex; justify-content: space-between; font-weight: 800; font-size: 1.15rem; color: var(--ld-green-primary); font-family: var(--font-heading);">
                <span>Total a Pagar:</span>
                <span th:text="${'$' + #numbers.formatDecimal(order.total, 0, 'POINT', 0, 'COMMA')}">$8.000</span>
            </div>
        </div>

        <!-- Actions -->
        <div style="display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;">
            <a th:href="@{/pedido/seguimiento/{code}(code=${order.orderCode},phone=${order.customerPhone})}" class="ld-btn ld-btn-lemon">
                <span>Rastrear Pedido</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </a>
            <a th:href="${whatsappUrl}" target="_blank" class="ld-btn ld-btn-outline">
                <span>Enviar por WhatsApp 💬</span>
            </a>
        </div>
    </div>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script>
        function copyOrderCode() {
            const pill = document.getElementById('orderCodePill');
            if (pill) {
                navigator.clipboard.writeText(pill.innerText.trim());
                const originalText = pill.innerText;
                pill.innerText = '¡Copiado! ✓';
                setTimeout(() => {
                    pill.innerText = originalText;
                }, 1800);
            }
        }
    </script>
</body>
</html>
