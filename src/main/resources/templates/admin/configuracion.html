<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración General - Lemon Drop Admin</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .setting-card {
            background: #FFF;
            border-radius: 14px;
            padding: 20px;
            border: 1px solid #E2E8F0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .setting-header {
            margin-bottom: 12px;
        }

        .setting-category-tag {
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 3px 8px;
            border-radius: 4px;
            background: #E8F5E9;
            color: #1B5E20;
            display: inline-block;
            margin-bottom: 6px;
        }

        .setting-title {
            font-size: 1.05rem;
            font-weight: 800;
            color: #1E293B;
            margin: 0 0 4px 0;
            font-family: 'Outfit', sans-serif;
        }

        .setting-desc {
            font-size: 0.8rem;
            color: #64748B;
            margin: 0;
        }

        .setting-input-wrapper {
            margin-top: 14px;
            display: flex;
            gap: 8px;
        }

        .setting-input {
            flex-grow: 1;
            padding: 10px 12px;
            border: 1px solid #CBD5E1;
            border-radius: 8px;
            font-size: 0.88rem;
            outline: none;
        }

        .setting-input:focus {
            border-color: #1B5E20;
        }
    </style>
</head>
<body>

    <div class="admin-layout">
        <!-- Sidebar -->
        <div th:replace="~{fragments/sidebar-admin :: sidebar}"></div>

        <!-- Main workspace -->
        <main class="main-content">
            <header style="margin-bottom: 24px;">
                <h1 style="font-size: 2.2rem; margin:0; font-family:'Outfit', sans-serif;">⚙️ Configuración del Negocio</h1>
                <p style="color: var(--text-secondary); margin-top:4px;">Administra los parámetros de WhatsApp, tiempos límite de preparación y reglas operativas de Lemon Drop.</p>
            </header>

            <div class="settings-grid">
                <div class="setting-card" th:each="s : ${settings}">
                    <div class="setting-header">
                        <span class="setting-category-tag" th:text="${s.category}">GENERAL</span>
                        <h3 class="setting-title" th:text="${s.label}">Nombre</h3>
                        <p class="setting-desc" th:text="${s.description}">Descripción</p>
                    </div>

                    <div>
                        <div class="setting-input-wrapper">
                            <input type="text" th:id="${'input-' + s.key}" th:value="${s.value}" class="setting-input">
                            <button type="button" class="btn-custom btn-lemon" style="padding:8px 16px; font-size:0.85rem;" th:attr="onclick=|saveSetting('${s.key}', this)|">
                                💾 Guardar
                            </button>
                        </div>
                        <div style="font-size:0.72rem; color:var(--text-secondary); margin-top:6px;" th:text="${'Última edición por ' + (s.updatedBy != null ? s.updatedBy : 'SYSTEM')}">
                            Auditoría
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        document.getElementById('side-settings').classList.add('active');

        function saveSetting(key, btnElement) {
            const input = document.getElementById('input-' + key);
            const val = input.value.trim();

            const oldText = btnElement.innerText;
            btnElement.disabled = true;
            btnElement.innerText = "⏳...";

            fetch('/admin/api/configuracion/guardar', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ key: key, value: val })
            })
            .then(res => {
                if (!res.ok) throw new Error("Error al guardar.");
                return res.json();
            })
            .then(updated => {
                btnElement.innerText = "✓ Guardado";
                btnElement.style.backgroundColor = "var(--green-medium)";
                btnElement.style.color = "#FFF";
                setTimeout(() => {
                    btnElement.disabled = false;
                    btnElement.innerText = oldText;
                    btnElement.style.backgroundColor = "";
                    btnElement.style.color = "";
                }, 1500);
            })
            .catch(err => {
                alert("Error al actualizar configuración: " + err.message);
                btnElement.disabled = false;
                btnElement.innerText = oldText;
            });
        }
    </script>
</body>
</html>
