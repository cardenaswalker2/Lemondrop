<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrar Complementos - Lemon Drop</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .complementos-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
            margin-top: 20px;
        }
        @media (max-width: 900px) {
            .complementos-layout {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="admin-layout">
        <!-- Sidebar -->
        <div th:replace="~{fragments/sidebar-admin :: sidebar}"></div>

        <!-- Main workspace -->
        <main class="main-content">
            <header>
                <h1 style="font-size: 2.2rem;">🥛 Complementos (Addons)</h1>
                <p style="color: var(--text-secondary);">Agrega, habilita o deshabilita complementos dulces (leche condensada, arequipe, etc.) para el menú.</p>
            </header>

            <div class="complementos-layout">
                <!-- Addons List -->
                <div class="card-premium">
                    <h3 style="margin-bottom: 20px;">Complementos Registrados</h3>
                    <div style="overflow-x:auto;">
                        <table style="width:100%; border-collapse:collapse; text-align:left;">
                            <thead>
                                <tr style="border-bottom: 2px solid var(--mint);">
                                    <th style="padding:12px;">Nombre</th>
                                    <th style="padding:12px;">Descripción</th>
                                    <th style="padding:12px;">Precio Adicional</th>
                                    <th style="padding:12px;">Disponibilidad</th>
                                    <th style="padding:12px;">Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="a : ${addons}" style="border-bottom:1px solid rgba(0,0,0,0.05);">
                                    <td style="padding:12px; font-weight:700;" th:text="${a.name}">Leche condensada</td>
                                    <td style="padding:12px;" th:text="${a.description}">desc</td>
                                    <td style="padding:12px; font-weight:700;" th:text="${'$' + #numbers.formatDecimal(a.additionalPrice, 0, 'POINT', 0, 'COMMA')}">$1.000</td>
                                    <td style="padding:12px;">
                                        <span th:text="${a.available ? 'Habilitado' : 'Agotado'}" th:class="${a.available ? 'badge-custom badge-fav' : 'badge-custom badge-out'}">Habilitado</span>
                                    </td>
                                    <td style="padding:12px; display:flex; gap:10px;">
                                        <button class="btn-custom btn-mint" style="padding: 5px 10px; font-size: 0.8rem;" th:attr="onclick=|fillAddonForm('${a.id}', '${a.name}', '${a.description}', '${a.additionalPrice}', ${a.available})|">Editar ✏️</button>
                                        <form th:action="@{/admin/complementos/eliminar/{id}(id=${a.id})}" method="post" onsubmit="return confirm('¿Seguro que deseas eliminar este complemento?')">
                                            <button type="submit" class="btn-custom btn-strawberry" style="padding: 5px 10px; font-size: 0.8rem;">Eliminar 🗑️</button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Inline Creation/Edit Form -->
                <div class="card-premium" style="background-color: var(--bg-cream); height: fit-content;">
                    <h3 id="formTitle" style="margin-bottom: 20px; border-bottom: 2px solid var(--mint); padding-bottom: 10px;">Añadir Complemento</h3>
                    <form th:action="@{/admin/complementos/guardar}" method="post" id="addonForm">
                        <input type="hidden" name="id" id="adnId">
                        
                        <div class="form-group">
                            <label class="form-label">Nombre *</label>
                            <input type="text" name="name" id="adnName" class="form-control" placeholder="Ej: Leche condensada" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Descripción</label>
                            <input type="text" name="description" id="adnDesc" class="form-control" placeholder="Ej: Chorra dulce y cremoso">
                        </div>

                        <div class="form-group">
                            <label class="form-label">Precio Adicional *</label>
                            <input type="number" name="additionalPrice" id="adnPrice" class="form-control" value="0" min="0" required>
                        </div>

                        <div class="form-group">
                            <label>
                                <input type="checkbox" name="available" id="adnAvail" checked>
                                <strong>Disponible para compra</strong>
                            </label>
                        </div>

                        <div style="display:flex; gap:10px; margin-top:25px;">
                            <button type="submit" class="btn-custom btn-lemon" style="width:100%;">Guardar</button>
                            <button type="button" class="btn-custom btn-outline" style="display:none;" id="btnCancelEdit" onclick="resetAddonForm()">Limpiar</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script>
        document.getElementById('side-addons').classList.add('active');

        function fillAddonForm(id, name, desc, price, available) {
            document.getElementById('formTitle').innerText = "Editar Complemento";
            document.getElementById('adnId').value = id;
            document.getElementById('adnName').value = name;
            document.getElementById('adnDesc').value = desc;
            document.getElementById('adnPrice').value = price;
            document.getElementById('adnAvail').checked = available;
            document.getElementById('btnCancelEdit').style.display = 'inline-block';
        }

        function resetAddonForm() {
            document.getElementById('formTitle').innerText = "Añadir Complemento";
            document.getElementById('adnId').value = "";
            document.getElementById('adnName').value = "";
            document.getElementById('adnDesc').value = "";
            document.getElementById('adnPrice').value = "0";
            document.getElementById('adnAvail').checked = true;
            document.getElementById('btnCancelEdit').style.display = 'none';
        }
    </script>
</body>
</html>
