<aside th:fragment="sidebar" class="sidebar" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <div class="sidebar-logo">
        <span>🍧 LEMON DROP</span>
    </div>
    
    <ul class="sidebar-menu">
        <li class="sidebar-item active">
            <a href="/asesor/dashboard">📋 Panel de Operación</a>
        </li>
        <li class="sidebar-item">
            <a href="/">🌐 Ver Web Pública</a>
        </li>
    </ul>

    <div class="sidebar-user">
        <div class="user-avatar" sec:authentication="name">A</div>
        <div style="flex-grow: 1;">
            <p style="font-weight: 700; font-size: 0.9rem; color: var(--dark);" sec:authentication="name">Asesor</p>
            <p style="font-size: 0.75rem; color: var(--text-secondary);">Asesor de Ventas</p>
        </div>
        <form th:action="@{/logout}" method="post">
            <button type="submit" style="background: none; border: none; cursor: pointer; font-size: 1.2rem;" title="Cerrar Sesión">🚪</button>
        </form>
    </div>
</aside>
