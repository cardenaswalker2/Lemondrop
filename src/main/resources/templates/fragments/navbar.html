<header th:fragment="navbar" class="ld-navbar" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <div class="ld-navbar-inner">
        <!-- Brand Logo -->
        <a href="/" class="ld-logo">
            <span class="ld-logo-icon">🍋</span>
            <span>LEMON DROP</span>
        </a>

        <!-- Desktop Navigation -->
        <ul class="ld-nav-links">
            <li><a href="/" id="nav-home" class="ld-nav-link">Inicio</a></li>
            <li><a href="/catalogo" id="nav-catalog" class="ld-nav-link">Nuestros Granizados</a></li>
            <li><a href="/pedido/seguimiento" id="nav-tracking" class="ld-nav-link">Seguimiento</a></li>
            
            <!-- Dynamic Authentication Actions -->
            <li sec:authorize="isAnonymous()">
                <a href="/login" class="ld-btn ld-btn-lemon ld-btn-sm">Ingresar</a>
            </li>
            <li sec:authorize="hasRole('ADMIN')">
                <a href="/admin/dashboard" class="ld-btn ld-btn-green ld-btn-sm">Panel Admin</a>
            </li>
            <li sec:authorize="hasRole('ASESOR')">
                <a href="/asesor/dashboard" class="ld-btn ld-btn-green ld-btn-sm">Panel Asesor</a>
            </li>
        </ul>

        <!-- Mobile Hamburger Toggle -->
        <button class="ld-nav-toggle" aria-label="Abrir menú" onclick="togglePublicMobileMenu()">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>
    </div>

    <!-- Mobile Drawer Overlay & Menu -->
    <div id="ldDrawerOverlay" class="ld-drawer-overlay" onclick="closePublicMobileMenu()"></div>
    <aside id="ldMobileDrawer" class="ld-mobile-drawer">
        <div>
            <div class="ld-drawer-header">
                <a href="/" class="ld-logo" style="font-size: 1.25rem;">
                    <span class="ld-logo-icon" style="width: 32px; height: 32px;">🍋</span>
                    <span>LEMON DROP</span>
                </a>
                <button class="ld-drawer-close" aria-label="Cerrar menú" onclick="closePublicMobileMenu()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <nav class="ld-drawer-links">
                <a href="/" class="ld-drawer-link" id="drawer-home">
                    <span>🏠</span> Inicio
                </a>
                <a href="/catalogo" class="ld-drawer-link" id="drawer-catalog">
                    <span>🍧</span> Nuestros Granizados
                </a>
                <a href="/pedido/seguimiento" class="ld-drawer-link" id="drawer-tracking">
                    <span>📦</span> Seguimiento de Pedido
                </a>
            </nav>
        </div>

        <div style="padding-top: 20px; border-top: 1px solid rgba(47, 125, 50, 0.12); display: flex; flex-direction: column; gap: 10px;">
            <div sec:authorize="isAnonymous()">
                <a href="/login" class="ld-btn ld-btn-lemon" style="width: 100%;">Ingresar al Sistema</a>
            </div>
            <div sec:authorize="hasRole('ADMIN')">
                <a href="/admin/dashboard" class="ld-btn ld-btn-green" style="width: 100%;">Panel Admin</a>
            </div>
            <div sec:authorize="hasRole('ASESOR')">
                <a href="/asesor/dashboard" class="ld-btn ld-btn-green" style="width: 100%;">Panel Asesor</a>
            </div>
            <p style="text-align: center; font-size: 0.8rem; color: var(--ld-text-muted);">
                Feria Escolar 2026 🍋
            </p>
        </div>
    </aside>

    <script>
        function togglePublicMobileMenu() {
            const overlay = document.getElementById('ldDrawerOverlay');
            const drawer = document.getElementById('ldMobileDrawer');
            if (overlay && drawer) {
                overlay.classList.toggle('active');
                drawer.classList.toggle('active');
                document.body.style.overflow = drawer.classList.contains('active') ? 'hidden' : '';
            }
        }

        function closePublicMobileMenu() {
            const overlay = document.getElementById('ldDrawerOverlay');
            const drawer = document.getElementById('ldMobileDrawer');
            if (overlay && drawer) {
                overlay.classList.remove('active');
                drawer.classList.remove('active');
                document.body.style.overflow = '';
            }
        }
    </script>
</header>
